# Build the hardware-CT job image and publish it to GHCR, so no one hand-builds
# it on the bench. Native arm64 (aarch64, matches the Pi runners); a QEMU
# cross-build would be far too slow for the probe-rs + caliper compile.
#
# Publishes ghcr.io/kaidokert/pi-hw-runner:latest and an immutable
# :caliper-<version>. The hw-ct reusable workflow's container-image default
# points at :latest, so a new release → new :latest → next job pulls it.
#
# The ghcr package must be PUBLIC (Packages → pi-hw-runner → visibility) so
# benches pull it without credentials.
name: build-hw-runner-image

on:
  release:
    types: [published]      # a caliper release rebuilds the image at that version
  workflow_dispatch:
    inputs:
      version:
        description: krabi-caliper version to bake in (default = the Dockerfile ARG)
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - hw-runner/**
      - .github/workflows/build-hw-runner-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # Version precedence: release tag (strip leading v) > dispatch input >
      # the Dockerfile's pinned ARG.
      - name: Resolve caliper version
        id: ver
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            v="${RELEASE_TAG#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            v="$INPUT_VERSION"
          else
            v="$(sed -nE 's/^ARG KRABI_CALIPER_VERSION=([0-9.]+).*/\1/p' hw-runner/Dockerfile | head -1)"
          fi
          [ -n "$v" ] || { echo "could not resolve version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "building krabi-caliper $v"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: hw-runner
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: |
            KRABI_CALIPER_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/kaidokert/pi-hw-runner:latest
            ghcr.io/kaidokert/pi-hw-runner:caliper-${{ steps.ver.outputs.version }}
