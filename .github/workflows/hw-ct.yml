name: krabi-caliper hardware campaign

on:
  workflow_call:
    inputs:
      invocation-name:
        description: Unique human-readable name for this workflow invocation
        required: true
        type: string
      campaigns-json:
        description: JSON array of krabi-caliper campaign names
        required: true
        type: string
      working-directory:
        description: Campaign workspace relative to the repository root
        required: false
        default: .
        type: string
      prepared:
        description: Build relocatable campaign bundles on a hosted runner
        required: false
        default: false
        type: boolean
      build-target:
        description: Rust target required to build prepared firmware
        required: false
        default: thumbv7em-none-eabihf
        type: string
      rig:
        description: Rig environment and lock name
        required: false
        default: stm32f407-dwt
        type: string
      runner-labels-json:
        description: JSON array of self-hosted runner labels
        required: false
        default: '["self-hosted","rig-stm32f407-dwt"]'
        type: string
      container-image:
        description: Hardware job image
        required: false
        default: 127.0.0.1:5000/pi-hw-runner:caliper-0.1.3
        type: string
      container-options:
        description: Docker options for probe access and CPU control
        required: false
        default: --privileged --cpus 3.2
        type: string
      timeout-minutes:
        description: Overall hardware-job timeout
        required: false
        default: 60
        type: number
      lock-timeout-seconds:
        description: Maximum wait for the host-local rig lock
        required: false
        default: 1800
        type: number
      caliper-version:
        description: Exact krabi-caliper CLI version used for build and run
        required: false
        default: 0.1.3
        type: string
      opt-level:
        description: Release opt-level override for prepared builds (empty keeps the profile's)
        required: false
        default: ""
        type: string

jobs:
  build:
    if: inputs.prepared
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CAMPAIGNS: ${{ join(fromJSON(inputs.campaigns-json), ' ') }}
      OPT_LEVEL: ${{ inputs.opt-level }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.build-target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ inputs.working-directory }}/target
          key: hw-ct-build-${{ inputs.caliper-version }}-opt${{ inputs.opt-level }}-${{ hashFiles(format('{0}/Cargo.toml', inputs.working-directory), format('{0}/Cargo.lock', inputs.working-directory), format('{0}/krabi-caliper.toml', inputs.working-directory)) }}
          restore-keys: hw-ct-build-${{ inputs.caliper-version }}-opt${{ inputs.opt-level }}-

      - name: Restore krabi-caliper CLI
        id: caliper-cli-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/cargo-krabi-caliper
            ~/.cargo/bin/krabi-caliper-simavr
          key: caliper-cli-${{ runner.os }}-${{ runner.arch }}-${{ inputs.caliper-version }}

      - name: Install krabi-caliper CLI
        if: steps.caliper-cli-cache.outputs.cache-hit != 'true'
        env:
          CALIPER_VERSION: ${{ inputs.caliper-version }}
        run: |
          [[ "$CALIPER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::invalid krabi-caliper version: $CALIPER_VERSION"
            exit 1
          }
          cargo install \
            krabi-caliper \
            --version "=$CALIPER_VERSION" \
            --locked \
            --features cli,campaign

      - name: Save krabi-caliper CLI
        if: steps.caliper-cli-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/bin/cargo-krabi-caliper
            ~/.cargo/bin/krabi-caliper-simavr
          key: caliper-cli-${{ runner.os }}-${{ runner.arch }}-${{ inputs.caliper-version }}

      - name: Build prepared campaigns
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if [ -n "$OPT_LEVEL" ]; then
            export CARGO_PROFILE_RELEASE_OPT_LEVEL="$OPT_LEVEL"
          fi
          for campaign in $CAMPAIGNS; do
            cargo krabi-caliper build \
              "$campaign" \
              --output "$RUNNER_TEMP/prepared/$campaign"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: krabi-hw-prepared-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.invocation-name }}
          path: ${{ runner.temp }}/prepared
          if-no-files-found: error
          retention-days: 3

  hardware:
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    # Keyed per ref and invocation: GitHub keeps one pending job per group,
    # so a shared key lets another branch or matrix variant cancel this one.
    # The rig lock in krabi-hw-run serialises access to the hardware.
    concurrency:
      group: hw-ct-${{ github.repository }}-${{ github.ref }}-${{ inputs.rig }}-${{ inputs.invocation-name }}
      cancel-in-progress: false
    runs-on: ${{ fromJSON(inputs.runner-labels-json) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    container:
      image: ${{ inputs.container-image }}
      options: ${{ inputs.container-options }}
      volumes:
        - /dev/bus/usb:/dev/bus/usb
        - /run/lock:/run/lock
        - /srv/krabi-caliper/rigs:/rigs:ro
    steps:
      - name: Check opt-level applies
        if: inputs.opt-level != '' && !inputs.prepared
        run: |
          echo "::error::opt-level only applies to prepared builds"
          exit 1

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        if: inputs.prepared
        with:
          name: krabi-hw-prepared-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.invocation-name }}
          path: ${{ runner.temp }}/prepared

      - uses: kaidokert/krabi-caliper-rs/.github/actions/krabi-hw-run@main
        with:
          rig: ${{ inputs.rig }}
          campaigns: ${{ join(fromJSON(inputs.campaigns-json), ' ') }}
          working-directory: ${{ inputs.working-directory }}
          prepared: ${{ inputs.prepared }}
          prepared-root: ${{ runner.temp }}/prepared
          lock-timeout-seconds: ${{ inputs.lock-timeout-seconds }}
          caliper-version: ${{ inputs.caliper-version }}
