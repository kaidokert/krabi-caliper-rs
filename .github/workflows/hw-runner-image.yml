# Build the hardware job image (hw-runner/Dockerfile) on a GitHub-hosted arm64
# runner — native, matching the Pi rigs; QEMU would be far too slow for the
# probe-rs + krabi-caliper compile — and publish it to
# ghcr.io/kaidokert/pi-hw-runner:caliper-<version>-probe-rs-<tag>-<distro>.
#
# The tag is derived from the Dockerfile and is never overwritten: if it already
# exists the build is skipped, so a tag always names the image that was first
# published under it. Publishing from pull requests means the image a default
# names exists, and has been built, before that default reaches main.
#
# The package must stay PUBLIC so rigs and other repos pull it without
# credentials; the image holds no secrets.
name: hw-runner image

on:
  pull_request:
    paths:
      - hw-runner/**
      - .github/workflows/hw-runner-image.yml
      - .github/workflows/hw-ct.yml
      - .github/actions/krabi-hw-run/action.yml
  push:
    branches: [main]
    paths:
      - hw-runner/**
      - .github/workflows/hw-runner-image.yml
      - .github/workflows/hw-ct.yml
      - .github/actions/krabi-hw-run/action.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/kaidokert/pi-hw-runner
  DOCKERFILE: hw-runner/Dockerfile

jobs:
  tag:
    name: Derive the tag and check the defaults use it
    runs-on: ubuntu-latest
    outputs:
      caliper: ${{ steps.tag.outputs.caliper }}
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: tag
        run: |
          set -euo pipefail
          arg() { sed -nE "s/^ARG $1=(.+)$/\1/p" "$DOCKERFILE" | head -1; }
          caliper="$(arg KRABI_CALIPER_VERSION)"
          probe_rs="$(arg PROBE_RS_TAG)"
          distro="$(sed -nE 's/^FROM rust:1-([a-z]+).*/\1/p' "$DOCKERFILE" | head -1)"
          if [ -z "$caliper" ] || [ -z "$probe_rs" ] || [ -z "$distro" ]; then
            echo "::error file=$DOCKERFILE::could not read KRABI_CALIPER_VERSION, PROBE_RS_TAG or the rust:1-<distro> base"
            exit 1
          fi
          ref="$IMAGE:caliper-$caliper-probe-rs-${probe_rs#v}-$distro"
          echo "caliper=$caliper" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "image: $ref"

      - name: Check hw-ct.yml and krabi-hw-run default to this image
        env:
          CALIPER: ${{ steps.tag.outputs.caliper }}
          REF: ${{ steps.tag.outputs.ref }}
        run: |
          set -euo pipefail
          # The `default:` line following each named input.
          default_of() { awk -v key="$2:" '$1 == key { found = 1; next } found && $1 == "default:" { sub(/^[^:]*: */, ""); print; exit }' "$1"; }
          status=0
          check() {
            if [ "$3" != "$4" ]; then
              echo "::error file=$1::$2 defaults to '$3', but $DOCKERFILE builds '$4'"
              status=1
            fi
          }
          check .github/workflows/hw-ct.yml container-image "$(default_of .github/workflows/hw-ct.yml container-image)" "$REF"
          check .github/workflows/hw-ct.yml caliper-version "$(default_of .github/workflows/hw-ct.yml caliper-version)" "$CALIPER"
          check .github/actions/krabi-hw-run/action.yml caliper-version "$(default_of .github/actions/krabi-hw-run/action.yml caliper-version)" "$CALIPER"
          exit "$status"

  build:
    name: Build and publish (arm64)
    needs: tag
    # A fork's pull request gets a read-only token and must not publish.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      REF: ${{ needs.tag.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip a tag that is already published
        id: exists
        run: |
          if docker manifest inspect "$REF" >/dev/null 2>&1; then
            echo "$REF is already published; tags are never overwritten. Change an ARG in $DOCKERFILE to publish a new image."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.published != 'true'

      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.published != 'true'
        with:
          context: hw-runner
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ env.REF }}

      - name: Check the image provides the pinned tools
        env:
          CALIPER: ${{ needs.tag.outputs.caliper }}
        run: |
          set -euo pipefail
          docker run --rm "$REF" sh -c '
            cargo install --list | grep -Fx "krabi-caliper v$0:" &&
            probe-rs --version' "$CALIPER"
